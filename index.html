<!doctype html>
<html lang="zh-CN">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
	<meta name="description" content="Hooay 的个人博客 —— 折腾笔记、代码片段与踩坑记录。">
	<meta name="keywords" content="hooay, hooay233, 博客, Cloudflare Pages">
	<meta name="robots" content="index, follow">
	<title>Hooay 的博客</title>
	<link rel="shortcut icon" href="favicon.png">

	<!-- 图标（Font Awesome 5）与站点外壳样式 -->
	<link rel="stylesheet" href="css/all.min.css">
	<link rel="stylesheet" href="css/site.css">
</head>

<body>
	<div class="page-wrap">

		<!-- 顶部导航栏 -->
		<header class="headbar">
			<div class="leftonhb"><a class="brand" href="index.html">Hooay 的博客</a></div>
			<nav class="sitenav" id="sitenav">
				<a class="nav-link" href="index.html">首页</a>
				<a class="nav-link" href="index.html#posts">文章列表</a>
				<a class="nav-link" href="about.html">关于</a>
			</nav>
			<div class="rightonhb"><button type="button" id="theme-toggle" class="graybtn">切换到暗色模式</button></div>
		</header>

		<!-- 欢迎语 / 站长简介 -->
		<section class="title">
			<h1 class="bigger">Hooay Chen</h1>
			<p class="small gray">
				(@hooay233) · <ruby>摸鱼<rp>(</rp><rt>MoYu</rt><rp>)</rp></ruby>之余，把折腾过的东西写下来
			</p>
			<p>
				这里放我的<ruby>折腾<rp>(</rp><rt>tinkering</rt><rp>)</rp></ruby>笔记、代码片段和踩坑记录。
			</p>
		</section>

		<!-- 文章列表区 -->
		<main class="mainbody" id="posts">
			<form id="search-form" class="searchbar" role="search">
				<input id="search-input" class="mb-input search-input" type="search" autocomplete="off" placeholder="搜索文章标题 / 简介…">
				<button type="submit" class="pinkbtn spcbtn_disabled" id="search-submit">搜索</button>
				<button type="button" class="graybtn spcbtn_disabled" id="search-clear">重置</button>
				<label class="sortwrap gray small">排序
					<select id="sort-select">
						<option value="newest">最新</option>
						<option value="oldest">最早</option>
					</select>
				</label>
			</form>

			<div id="keyword-bar" class="keyword-bar"></div>
			<div id="status" class="status small gray"></div>
			<div id="post-list" class="post-list"></div>
			<nav id="pager" class="pager"></nav>

			<noscript>
				<p class="small gray">文章列表与搜索需要启用 JavaScript。</p>
			</noscript>
		</main>

		<!-- 页脚：访问统计 / 版权 -->
		<footer id="bottom">
			<span class="gray small">访问次数：</span>
			<img src="https://count.getloli.com/@hooay233Blog?name=hooay233Blog&padding=1&offset=0&align=center&theme=rule34"
				alt="hooay233Blog 访问次数">
			<span class="gray small">© 2026 Hooay · 保留所有权利</span>
			<span class="gray small">Powered by
				<a href="https://pages.cloudflare.com/" target="_blank" rel="noopener noreferrer">Cloudflare Pages</a>
			</span>
		</footer>

	</div>

	<!-- 脚本：theme.js 必须排在 site.js 之前（defer 保证按文档顺序执行） -->
	<script src="js/theme.js" defer></script>
	<script src="js/api.js" defer></script>
	<script src="js/site.js" defer></script>
</body>

</html>
